<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<title>الموافقة على عرض السعر | تنمويين مصر</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<style>
:root{--navy:#1a3a6e;--sky:#0094cc;--ice:#eaf5fc;--ink:#1a2a3a;--muted:#5e7282;--line:#d6e4ee;--ok:#00a37a;--okbg:#e7faf3;--gold:#f2b33d;--goldbg:#fdf3dc;--bad:#e05050}
*{box-sizing:border-box}
body{margin:0;background:#f2f6fa;font-family:Cairo,system-ui,sans-serif;color:var(--ink);line-height:1.7}
.wrap{max-width:620px;margin:0 auto;padding:20px 16px 48px}
.logo{display:block;width:170px;margin:4px auto 14px}
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 18px rgba(14,42,68,.07);margin-bottom:14px}
h1{font-size:20px;margin:0 0 4px;color:var(--navy)}
.sub{color:var(--muted);font-size:13.5px;margin:0}
.no{display:inline-block;background:var(--ice);color:var(--navy);font-weight:700;font-size:12.5px;border-radius:20px;padding:2px 12px;margin-top:8px;direction:ltr}
.rows{margin:14px 0 0;border-top:1px solid var(--line)}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.row b{font-size:16px;color:var(--navy);white-space:nowrap}
.row small{display:block;color:var(--muted);font-size:12.5px}
.once{color:#b4590a !important}
.hot{background:var(--goldbg);border:1.5px solid var(--gold);border-radius:12px;padding:12px 14px;margin-top:14px;font-weight:700;color:#8a5a00;font-size:14px}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 4px}
input,textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:15px;background:#fff;color:var(--ink)}
input:focus,textarea:focus{outline:2px solid var(--sky);outline-offset:1px;border-color:transparent}
.chk{display:flex;gap:8px;align-items:flex-start;margin-top:14px;font-size:13.5px;font-weight:600}
.chk input{width:18px;height:18px;margin-top:4px;flex:none}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
button{flex:1;min-width:150px;border:0;border-radius:12px;padding:13px 16px;font:inherit;font-size:15.5px;font-weight:800;cursor:pointer}
.go{background:var(--ok);color:#fff}.ask{background:var(--ice);color:var(--navy)}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--bad);font-weight:700;font-size:13.5px;margin-top:10px;display:none}
.done{text-align:center}
.done .big{font-size:44px;line-height:1}
.pay{background:var(--ice);border-radius:12px;padding:12px 14px;margin-top:14px;font-size:14px;text-align:right}
.pay div{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.pay b{direction:ltr;unicode-bidi:plaintext}
.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.links a{flex:1;min-width:150px;text-align:center;text-decoration:none;font-weight:800;border-radius:12px;padding:12px;font-size:14.5px}
.wa{background:#e7faf3;color:#00703a}.em{background:#fff3cd;color:#c06010}
.muted{color:var(--muted);font-size:13px}
.center{text-align:center}
</style>
</head>

    (Q.senderEmail?'<a class="em" href="mailto:'+encodeURIComponent(Q.senderEmail)+'?subject='+encodeURIComponent('تحويل جدية التعاقد - '+Q.no)+'&body='+encodeURIComponent(msg)+'">ابعت صورة التحويل بالإيميل</a>':'')+'</div>'}
function done(r){if(r.decision==='accepted'){app.innerHTML='<div class="card done"><div class="big">✅</div><h1>شكرا. وصلتنا موافقتكم على العرض</h1><p class="sub">العرض رقم <span dir="ltr">'+E(Q.no)+'</span> · '+E(r.name||'')+(r.title?' · '+E(r.title):'')+'</p>'+
    '<div class="hot">الخطوة الجاية: حوّلوا جدية التعاقد '+f(Q.deposit)+' جنيه لتأكيد مكان جمعيتكم والباقي '+f(Q.setup-Q.deposit)+' جنيه بعد تسليم المنصة.</div>'+payBox()+contactLinks()+
    '<p class="muted">مكان جمعيتكم بيتأكد بعد ما نستلم التحويل وهنرد عليكم بتأكيد الحجز وميعاد التسليم.</p></div>'}
  else{app.innerHTML='<div class="card done"><div class="big">💬</div><h1>وصلنا استفساركم</h1><p class="sub">هنتواصل معاكم قريب. ولو اتفقنا تقدروا ترجعوا لنفس الرابط وتوافقوا على العرض.</p><div class="btns"><button class="go" id="again">نوافق على العرض دلوقتي</button></div></div>';
    document.getElementById('again').onclick=()=>form(r)}}
function form(prev){const annual=Q.monthly*(Q.annualMonths||10);
  app.innerHTML='<div class="card"><h1>عرض سعر منصة الفرص والمنح</h1><p class="sub">مقدم إلى '+E(Q.assoc||'الجمعية')+'</p><span class="no">'+E(Q.no)+'</span>'+
  '<div class="rows"><div class="row"><span>رسوم التأسيس<small>تدريب الفريق وتشغيل الحساب وتجهيز بيانات الجمعية</small></span><b class="once">'+f(Q.setup)+' جنيه<small class="once">تدفع مرة واحدة</small></b></div>'+
  '<div class="row"><span>الاشتراك الشهري<small>الاستضافة واشتراكات الذكاء الاصطناعي · السداد ربع سنوي مقدما</small></span><b>'+f(Q.monthly)+' جنيه</b></div>'+
  (Q.annualMonths&&Q.annualMonths<12?'<div class="row"><span>لو دفعتم السنة مقدم<small>بدل '+f(Q.monthly*12)+' جنيه</small></span><b>'+f(annual)+' جنيه</b></div>':'')+
  '<div class="row"><span>جدية التعاقد<small>بتتخصم من رسوم التأسيس والباقي بعد تسليم المنصة</small></span><b>'+f(Q.deposit)+' جنيه</b></div></div>'+
  (Q.validUntil?'<p class="muted">العرض صالح لحد '+E(Q.validUntil)+' أو لحد اكتمال أماكن أول '+f(Q.cap||100)+' جمعية.</p>':'')+'</div>'+
  '<div class="card"><h1 style="font-size:17px">الموافقة على العرض</h1><p class="sub">اكتبوا بيانات المسؤول اللي بيوافق باسم الجمعية.</p>'+
  '<label for="n">الاسم</label><input id="n" autocomplete="name" value="'+E(Q.contact||'')+'">'+
  '<label for="t">الصفة</label><input id="t" placeholder="مثلا رئيس مجلس الإدارة أو المدير التنفيذي">'+
  '<label for="p">رقم الموبايل</label><input id="p" inputmode="tel" dir="ltr" style="text-align:right">'+
  '<label for="m">ملاحظات أو استفسار (اختياري)</label><textarea id="m" rows="3"></textarea>'+
  '<label class="chk"><input type="checkbox" id="c"><span>أقر إني مفوض من الجمعية وإن الجمعية موافقة على عرض السعر رقم <span dir="ltr">'+E(Q.no)+'</span> بالأسعار والشروط اللي فيه.</span></label>'+
  '<div class="btns"><button class="go" id="yes">✅ نوافق على العرض</button><button class="ask" id="q">💬 عندنا استفسار</button></div><div class="err" id="er"></div></div>';
  const $=id=>document.getElementById(id),er=$('er');
  const send=async dec=>{const name=$('n').value.trim(),title=$('t').value.trim(),phone=$('p').value.trim(),note=$('m').value.trim();er.style.display='none';
    const bad=t=>{er.textContent='⚠️ '+t;er.style.display='block'};
    if(name.length<3)return bad('اكتب الاسم');if(dec==='accepted'&&!title)return bad('اكتب الصفة');
    if(dec==='accepted'&&!$('c').checked)return bad('علّم على الإقرار علشان نسجل الموافقة');if(dec==='question'&&note.length<3)return bad('اكتب استفساركم في الملاحظات');
    $('yes').disabled=$('q').disabled=true;
    const r={decision:dec,name:name.slice(0,110),title:title.slice(0,110),phone:phone.slice(0,30),note:note.slice(0,900),quoteNo:String(Q.no||'').slice(0,40),at:firebase.firestore.FieldValue.serverTimestamp()};
    try{const ref=db.collection('quote_responses').doc(k);if(prev)await ref.update(r);else await ref.set(r);
      notify((dec==='accepted'?'✅ موافقة على عرض سعر ':'💬 استفسار على عرض سعر ')+Q.no+' - '+(Q.assoc||''),'الجمعية: '+(Q.assoc||'')+'\nالعرض: '+Q.no+'\nالاسم: '+name+'\nالصفة: '+title+'\nالموبايل: '+phone+'\nملاحظات: '+note);
      done(r)}catch(e){console.warn(e);bad('معرفناش نسجل الرد. جرّب تاني أو ابعتولنا إيميل بالموافقة');$('yes').disabled=$('q').disabled=false}};
  $('yes').onclick=()=>send('accepted');$('q').onclick=()=>send('question')}
(async()=>{if(!/^[a-z0-9]{12,40}$/i.test(k))return fail('الرابط ده مش كامل');
  try{const s=await db.collection('quote_public').doc(k).get();if(!s.exists)return fail('العرض ده مش موجود أو اتلغى');Q=s.data();
    if(Q.status==='cancelled')return fail('العرض ده اتلغى. تواصلوا معانا لعرض جديد');
    let r=null;try{const x=await db.collection('quote_responses').doc(k).get();if(x.exists)r=x.data()}catch(e){}
    if(r)done(r);else form(null)}catch(e){console.warn(e);fail('معرفناش نفتح العرض دلوقتي. جرّب تاني بعد شوية')}})();
</script>
</body>
</html>
