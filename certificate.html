    var li='https://www.linkedin.com/profile/add?startTask=CERTIFICATION_NAME'+
      '&name='+encodeURIComponent('شهادة حضور: '+c.courseTitle)+
      '&organizationName='+encodeURIComponent('أكاديمية تنمويين مصر للتعلم عن بعد')+
      '&issueYear='+issued.getFullYear()+'&issueMonth='+(issued.getMonth()+1)+
      '&certUrl='+encodeURIComponent(url)+'&certId='+encodeURIComponent(id);
    wrap.innerHTML='<div class="ok">✅ <div><b>شهادة صحيحة وموثّقة</b><br>صادرة من أكاديمية تنمويين مصر للتعلم عن بعد باسم <b>'+esc(c.name)+'</b> — رقم <span dir="ltr">'+esc(id)+'</span></div></div>'+
      '<div class="stage" id="stage"><div class="scaler" id="scaler"></div></div>'+
      '<div class="actions"><button type="button" id="b-pdf">📄 تحميل PDF</button><button type="button" id="b-png" class="alt">🖼️ تحميل صورة</button>'+
      '<a class="li" href="'+li+'" target="_blank" rel="noopener">in أضفها على LinkedIn</a><button type="button" id="b-share" class="alt">📤 مشاركة</button></div>';
    var scaler=document.getElementById('scaler'), stage=document.getElementById('stage');
    scaler.appendChild(node);
    function fit(){ var s=stage.clientWidth/1123; scaler.style.transform='scale('+s+')'; stage.style.height=(794*s)+'px'; }
    fit(); window.addEventListener('resize',fit);
    (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(function(){
      var max=700; if(nameEl.scrollWidth>max){ nameEl.style.fontSize=Math.max(36,Math.floor(66*max/nameEl.scrollWidth))+'px'; }
    });

    function loadScript(src){ return new Promise(function(res,rej){ var s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
    var libs=null;
    function ensureLibs(){ return libs||(libs=Promise.all([loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'),loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')])); }
    async function render(){
      await ensureLibs(); if(document.fonts&&document.fonts.ready) await document.fonts.ready;
      var host=document.createElement('div'); host.style.cssText='position:fixed;left:-20000px;top:0';
      var clone=node.cloneNode(true); host.appendChild(clone); document.body.appendChild(host);
      try{ return await html2canvas(clone,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false}); } finally{ host.remove(); }
    }
    var fname='شهادة_'+String(c.name).replace(/\s+/g,'_')+'_'+id;
    document.getElementById('b-pdf').onclick=async function(){
      var b=this; b.disabled=true; b.textContent='⏳ جاري التجهيز...';
      try{ var cv=await render(); var pdf=new window.jspdf.jsPDF({orientation:'landscape',unit:'pt',format:'a4'});
        pdf.addImage(cv.toDataURL('image/jpeg',0.95),'JPEG',0,0,pdf.internal.pageSize.getWidth(),pdf.internal.pageSize.getHeight());
        pdf.setProperties({title:'شهادة حضور - '+c.name}); pdf.save(fname+'.pdf'); }
      catch(e){ alert('تعذر تجهيز الملف، جرّب تاني'); }
      b.disabled=false; b.textContent='📄 تحميل PDF';
    };
    document.getElementById('b-png').onclick=async function(){
      var b=this; b.disabled=true; b.textContent='⏳ جاري التجهيز...';
      try{ var cv=await render(); var a=document.createElement('a'); a.href=cv.toDataURL('image/png'); a.download=fname+'.png'; document.body.appendChild(a); a.click(); a.remove(); }
      catch(e){ alert('تعذر تجهيز الصورة، جرّب تاني'); }
      b.disabled=false; b.textContent='🖼️ تحميل صورة';
    };
    document.getElementById('b-share').onclick=function(){
      var text='🎓 حصلت على شهادة حضور تدريب "'+c.courseTitle+'" من أكاديمية تنمويين مصر للتعلم عن بعد\n'+url;
      if(navigator.share) navigator.share({title:'شهادة حضور',text:text}).catch(function(){});
      else if(navigator.clipboard) navigator.clipboard.writeText(text).then(function(){ alert('✅ اتنسخ اللينك'); });
    };
  }).catch(function(e){ fail('تعذر الاتصال بسجلات الأكاديمية'); console.warn(e); });
})();
</script>
</body>
</html>
